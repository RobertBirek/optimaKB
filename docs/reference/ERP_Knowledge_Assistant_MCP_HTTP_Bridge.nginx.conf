server {
    listen 443 ssl http2;
    server_name erp-kb-mcp.intra.example.local;

    ssl_certificate     /etc/ssl/certs/erp-kb-mcp.crt;
    ssl_certificate_key /etc/ssl/private/erp-kb-mcp.key;

    client_max_body_size 1m;

    location /health {
        proxy_pass http://127.0.0.1:3400/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:3400/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
